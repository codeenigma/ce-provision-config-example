---
# Standard Drupal cache behaviours for CloudFront
# Note, these can also be set in the AWS EC2 Autoscale role
aws_cloudfront_distribution:
  cache_behaviors:
    - target_origin_id: "ELB-{{ aws_ec2_autoscale_cluster.name }}"
      path_pattern: "/user/*"
      viewer_protocol_policy: redirect-to-https
      allowed_methods:
        items:
          - GET
          - HEAD
          - OPTIONS
          - PUT
          - POST
          - PATCH
          - DELETE
        cached_methods:
          - GET
          - HEAD
          - OPTIONS
      min_ttl: 0
      max_ttl: 300000
      default_ttl: 3600
      forwarded_values:
        query_string: true
        cookies:
          forward: all
        headers: ['*'] # All headers.
      smooth_streaming: false
      compress: true
