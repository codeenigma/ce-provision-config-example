---
# Default AWS RDS configuration
aws_rds:
  aws_profile: "{{ _aws_profile }}"
  region: "{{ _aws_region }}"
  engine: mariadb
  # for MariaDB must start with a letter and be alphanumeric and fewer than 16 chars long.
  master_username: "{{ _aws_resource_name | regex_replace('[^A-z0-9]', '') | regex_replace('^([0-9])', '') | truncate(16, True, '', 0) }}"
  master_user_password: "{{ lookup('password', _ce_provision_data_dir + '/' + _aws_resource_name + '/rds-passphrase chars=ascii_letters,digits length=32') }}"
  name: "{{ _aws_resource_name }}"
  tags: "{{ _aws_tags }}"
  description: "{{ _aws_resource_name }}"
  rds_cloudwatch_alarms: # name will have the RDS identifier prepended.
    - name: "{{ _infra_name }}_free_storage_space_threshold_{{ _env_type }}"
      description: "Average database free storage space over the last 10 minutes too low."
      metric: "FreeStorageSpace"
      namespace: "AWS/RDS"
      statistic: "Average"
      threshold: 20000000000
      unit: "Bytes"
      comparison: "LessThanOrEqualToThreshold"
      period: 600
      evaluation_periods: 1
    - name: "{{ _infra_name }}_cpu_utilization_too_high_{{ _env_type }}"
      description: "Average database CPU utilization over last 10 minutes too high."
      metric: "CPUUtilization"
      namespace: "AWS/RDS"
      statistic: "Average"
      threshold: 80
      unit: "Percent"
      comparison: "GreaterThanOrEqualToThreshold"
      period: 600
      evaluation_periods: 1
    - name: "{{ _infra_name }}_freeable_memory_too_low_{{ _env_type }}"
      description: "Average database freeable memory over last 10 minutes too low, performance may suffer."
      metric: "FreeableMemory"
      namespace: "AWS/RDS"
      statistic: "Average"
      threshold: 100000000
      unit: "Bytes"
      comparison: "LessThanThreshold"
      period: 600
      evaluation_periods: 1
    - name: "{{ _infra_name }}_disk_queue_depth_too_high_{{ _env_type }}"
      description: "Average database disk queue depth over last 10 minutes too high, performance may suffer."
      metric: "DiskQueueDepth"
      namespace: "AWS/RDS"
      statistic: "Average"
      threshold: 64
      unit: "Count"
      comparison: "GreaterThanThreshold"
      period: 600
      evaluation_periods: 1
    - name: "{{ _infra_name }}_swap_usage_too_high_{{ _env_type }}"
      description: "Average database swap usage over last 10 minutes too high, performance may suffer."
      metric: "SwapUsage"
      namespace: "AWS/RDS"
      statistic: "Average"
      threshold: 256000000
      unit: "Bytes"
      comparison: "GreaterThanThreshold"
      period: 600
      evaluation_periods: 1
  sns: "{{ _aws_sns }}" # see hosts/group_vars/all/_aws_sns.yml
